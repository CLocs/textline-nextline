name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - init_202608
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Use project wrangler (v4) — wrangler-action@v3 installs wrangler 3.x by default
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=textline-nextline --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
